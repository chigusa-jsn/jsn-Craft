name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jsn-craft-mod
          path: build/libs/*.jar

      # main に入るたびに、.jar をそのままダウンロードできるリリースを作る
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: jsn-Craft ビルド ${{ github.run_number }}
          body: |
            自動ビルド版です。下の Assets から .jar をダウンロードして、mods フォルダに入れてください。
            変更内容: ${{ github.event.head_commit.message }}
          files: build/libs/*.jar
          make_latest: true
